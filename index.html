<!DOCTYPE html>
<html lang="en">
<link rel="icon" type="image/png" href="./favicon.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raymuncito</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }

        #launchBtn {
            padding: 25px 45px;
            font-size: 40px;
            font-weight: bold;
            color: #000000;
            background-color: #ffd06c;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        #launchBtn:hover {
            background-color: #ffb52d;
        }

        #launchBtn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <button id="launchBtn">Play</button>
    <script>
        document.getElementById('launchBtn').addEventListener('click', () => {
            const popup = window.open('about:blank', '_blank', 'width=1000,height=700,scrollbars=no,resizable=yes');

            if (popup) {
                const targetUrl = new URL('./eagler.html', window.location.href).href; 

                popup.document.body.style.margin = '0';
                popup.document.body.style.padding = '0';
                popup.document.body.style.overflow = 'hidden';

                popup.document.body.innerHTML = `
                    <iframe src="${targetUrl}" 
                            style="width:100vw; height:100vh; border:none; margin:0; padding:0; overflow:hidden;">
                    </iframe>
                `;

                window.close();
                setTimeout(() => {
                    window.location.href = 'https://google.com';
                }, 100);

            } else {
                alert('Popup blocked! Please allow popups for this site so the window can open.');
            }
        });
    </script>

</body>
</html>
